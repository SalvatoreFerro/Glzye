name: Temporary Whisper Model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-whisper-model.yml'
      - 'trigger-model-download.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          test "$(stat -c%s ggml-base-q5_1.bin)" -gt 50000000

      - name: Package model
        run: zip -1 whisper-base-q5_1.zip ggml-base-q5_1.bin

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: whisper-base-q5_1.zip
          retention-days: 1
          if-no-files-found: error
